<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tienda Salta - Filtros</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f4f4f4;
      }
      .filtros {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .contenedor-productos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }
      .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .precio {
        font-weight: bold;
        color: #2c3e50;
      }
      .sin-stock {
        color: red;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Catálogo de Productos</h1>

    <div class="filtros">
      <input type="text" id="busqueda" placeholder="Buscar por nombre..." />

      <select id="categoria">
        <option value="todos">Todas las categorías</option>
        <option value="Electronica">Electrónica</option>
        <option value="Hogar">Hogar</option>
        <option value="Deportes">Deportes</option>
      </select>

      <label>
        Precio máx: $<span id="valor-precio">2000000</span>
        <input
          type="range"
          id="rangoPrecio"
          min="0"
          max="2000000"
          step="1000"
          value="2000000"
        />
      </label>

      <label> <input type="checkbox" id="checkStock" /> Solo en stock </label>
    </div>

    <div id="productos-lista" class="contenedor-productos"></div>

    <script src="Stock.js"></script>
  </body>
</html>
