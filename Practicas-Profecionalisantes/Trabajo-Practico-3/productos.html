<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tienda Salta - Filtros</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <h1>Catálogo de Productos":</h1>

    <div class="filtros">
      <input type="text" id="busqueda" placeholder="Buscar por nombre..." />

      <select id="categoria">
        <option value="todos">Todas las categorías</option>
        <option value="Electronica">Electrónica</option>
        <option value="Hogar">Hogar</option>
        <option value="Deportes">Deportes</option>
      </select>

      <label>
        Precio máx: $<span id="valor-precio">2000000</span>
        <input
          type="range"
          id="rangoPrecio"
          min="0"
          max="2000000"
          step="1000"
          value="2000000"
        />
      </label>

      <label> <input type="checkbox" id="checkStock" /> Solo en stock </label>
    </div>

    <div id="productos-lista" class="contenedor-productos"></div>

    <script src="Stock.js"></script>
  </body>
</html>
