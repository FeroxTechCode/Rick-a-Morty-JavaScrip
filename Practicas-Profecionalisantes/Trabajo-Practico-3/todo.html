<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mis Tareas - Salta 2026</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 50px;
      }
      .todo-container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      h2 {
        text-align: center;
        color: #1a73e8;
      }

      .form-tarea {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        flex: 1;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.3s;
      }
      input:focus {
        border-color: #1a73e8;
      }

      button#btn-agregar {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button#btn-agregar:hover {
        background: #1557b0;
      }

      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #fff;
        border-bottom: 1px solid #eee;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
      }
      li:hover {
        background: #f8f9fa;
      }

      .texto-tarea {
        cursor: pointer;
        flex: 1;
      }
      .completada {
        text-decoration: line-through;
        color: #888;
      }

      .btn-eliminar {
        background: #ff4d4d;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .btn-eliminar:hover {
        background: #cc0000;
      }

      .contador {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #555;
        font-weight: bold;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="todo-container">
      <h2>Lista de Tareas</h2>

      <form id="form-tarea" class="form-tarea">
        <input type="text" id="input-tarea" placeholder="¿Qué hay que hacer?" />
        <button type="submit" id="btn-agregar">Añadir</button>
      </form>

      <ul id="lista-tareas"></ul>

      <div class="contador">
        Tareas pendientes: <span id="cantidad-pendientes">0</span>
      </div>
    </div>

    <script src="todo.js"></script>
  </body>
</html>
