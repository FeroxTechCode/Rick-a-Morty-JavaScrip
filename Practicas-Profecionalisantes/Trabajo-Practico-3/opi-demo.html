<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Multiverso API - Personajes</title>
    <style>
      body {
        font-family: "Outfit", sans-serif;
        background: #1a1a1a;
        color: white;
        padding: 20px;
        text-align: center;
      }
      .grid-personajes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .card {
        background: #2d2d2d;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s;
        border: 1px solid #444;
        text-align: left;
      }
      .card:hover {
        transform: scale(1.05);
        border-color: #00ff00;
      }
      .card img {
        width: 100%;
        height: auto;
      }
      .info {
        padding: 15px;
      }
      .status {
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .vivo {
        color: #00ff00;
      }
      .muerto {
        color: #ff4444;
      }
      input#buscador {
        padding: 12px;
        width: 100%;
        max-width: 400px;
        border-radius: 8px;
        border: none;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Personajes del Multiverso</h1>
    <p>Consumiendo la API de Rick and Morty</p>

    <div style="margin-bottom: 20px">
      <input
        type="text"
        id="buscador"
        placeholder="Escribí un nombre (ej: Rick)..."
      />
      <p
        id="mensaje-info"
        style="color: gray; font-size: 0.9rem; margin-top: 5px"
      >
        Ingresá 3 caracteres para buscar.
      </p>
    </div>

    <div id="mensaje-carga" style="display: none; color: cyan">
      🛸 Viajando por el portal...
    </div>
    <div id="mensaje-error" style="display: none; color: #ff4444"></div>

    <div id="contenedor-personajes" class="grid-personajes"></div>

    <script src="opi-demo.js"></script>
  </body>
</html>
