<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="app.css" />
    <meta charset="UTF-8" />
    <title>Multiverso API - Personajes</title>
  </head>
  <body>
    <h1>Personajes del Multiverso</h1>
    <p>Consumiendo la API de Rick and Morty</p>

    <div style="margin-bottom: 20px">
      <input
        type="text"
        id="buscador"
        placeholder="Escribí un nombre (ej: Rick)..."
      />
      <p
        id="mensaje-info"
        style="color: gray; font-size: 0.9rem; margin-top: 5px"
      >
        Ingresá 3 caracteres para buscar.
      </p>
    </div>

    <div id="mensaje-carga" style="display: none; color: cyan">
      🛸 Viajando por el portal...
    </div>
    <div id="mensaje-error" style="display: none; color: #ff4444"></div>

    <div id="contenedor-personajes" class="grid-personajes"></div>

    <script src="opi-demo.js"></script>
  </body>
</html>
